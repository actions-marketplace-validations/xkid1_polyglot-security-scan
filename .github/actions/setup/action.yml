name: Setup Node and Yarn
description: >-
  Set up Node, the Yarn version pinned in package.json ("packageManager", via Corepack)
  and install dependencies exactly as yarn.lock pins them. Node comes from .nvmrc unless
  `node-version` is given.

inputs:
  node-version:
    description: Node version to use instead of .nvmrc
    required: false
    default: ''

runs:
  using: composite
  steps:
    # setup-node's own cache is off: it runs before Corepack provides the pinned Yarn.
    - if: inputs.node-version == ''
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        package-manager-cache: false
    - if: inputs.node-version != ''
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - name: Enable Corepack
      shell: bash
      run: |
        if ! command -v corepack >/dev/null 2>&1; then
          npm install --global corepack
        fi
        corepack enable
        corepack install

    # Cache Yarn's package archives (not node_modules), keyed on the lockfile.
    - name: Locate Yarn cache
      id: yarn-cache
      shell: bash
      run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
    - name: Cache Yarn packages
      uses: actions/cache@v6
      with:
        path: ${{ steps.yarn-cache.outputs.dir }}
        key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
        restore-keys: |
          yarn-${{ runner.os }}-

    # --immutable: fail instead of changing yarn.lock. Install scripts are disabled in
    # .yarnrc.yml (enableScripts: false), so no dependency runs code on the runner.
    - name: Install dependencies
      shell: bash
      run: yarn install --immutable
